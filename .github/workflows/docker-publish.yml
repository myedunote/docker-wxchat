# ============================================================
# 构建并发布 Docker 镜像到 GitHub Packages (GHCR)
# ------------------------------------------------------------
# 触发：
#   · push 到 main          → 构建并推送（打 main / latest / sha-xxx 标签）
#   · push 形如 v2.0.1 的 tag → 构建并推送（打 2.0.1 / 2.0 / sha-xxx 标签）
#   · pull request 到 main   → **只构建不推送**，用来提前发现构建失败
#   · 手动触发（Actions 页面上的 Run workflow）
#
# 产物：ghcr.io/myedunote/docker-wxchat
#   amd64 与 arm64 双架构（自托管场景里群晖 / 树莓派 / Apple Silicon 很常见）
#
# 为什么有 verify 这个前置任务：
#   镜像一旦推上去，别人就会 pull 走。让一个自检不通过的版本占用
#   latest 标签，比构建失败糟糕得多 —— 构建失败至少是显式的。
# ============================================================

name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/标签上重复触发时，取消上一次未跑完的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------
  # 1. 自检：跑一遍项目自带的静态与接口自检
  # ----------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 纯静态检查，不需要服务端：核对每个环境变量都真的被代码消费了
      - name: 环境变量消费审计
        run: npm run audit:env

      - name: 启动服务端并等待就绪
        run: |
          set -e
          ACCESS_PASSWORD=test-password-123 node src/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf --noproxy '*' http://127.0.0.1:3000/api/health > /dev/null; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时，日志如下：" >&2
          cat /tmp/server.log >&2
          exit 1

      - name: 运行自检
        run: NO_PROXY='*' ACCESS_PASSWORD=test-password-123 node scripts/selfcheck.js

      # 用真实 SIGTERM 验证优雅关闭链路（POSIX 信号在 ubuntu runner 上可用）。
      # 这条链路决定了「docker stop 时数据是否安全落盘」，此前没有任何断言。
      - name: 优雅关闭回归测试
        run: npm run test:shutdown

      - name: 失败时打印服务端日志
        if: failure()
        run: cat /tmp/server.log || true

  # ----------------------------------------------------------
  # 2. 构建并推送镜像
  # ----------------------------------------------------------
  build:
    needs: verify
    runs-on: ubuntu-latest
    # better-sqlite3 没有 Alpine(musl) 的预编译包，要在容器里用源码编译；
    # arm64 那条走 QEMU 模拟，编译很慢，所以超时给得比较宽。
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 读取 package.json 版本号
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # GHCR 的镜像名必须全小写，而 GitHub 仓库名允许大写字母
      - name: 归一化镜像名为小写
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 安装 QEMU（构建 arm64 需要）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      # PR 来自 fork 时没有写权限，因此只在非 PR 场景登录
      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.pkg.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=docker-wxchat
            org.opencontainers.image.description=微信文件传输助手 · 自托管 Docker 发行版
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 输出镜像摘要
        run: |
          echo "### 已发布镜像" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
